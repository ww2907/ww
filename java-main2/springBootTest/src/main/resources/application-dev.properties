# ============ 服务地址 ============
# 绑定本机局域网 IP：局域网内其它设备可用 http://192.168.68.31:8081 访问。
# 换网络 / 换机器后需同步修改（前端 vite.config.js 的 LAN_HOST 也要一起改）。
# 若想同时保留 http://localhost:8081 访问，把下面一行改成 server.address=0.0.0.0
server.address=192.168.68.31
server.port=8081

# ============ 数据源（MyBatis-Plus 使用） ============
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shiguang_food?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ MyBatis-Plus 配置 ============
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 开发环境打印 SQL（生产可关闭）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
