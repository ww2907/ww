server.port=8081

# ============ 数据源（MyBatis-Plus 使用） ============
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shiguang_food?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ MyBatis-Plus 配置 ============
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 开发环境打印 SQL（生产可关闭）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
