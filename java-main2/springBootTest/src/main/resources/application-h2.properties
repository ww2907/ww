server.port=8081

# ============ H2 嵌入式内存库（演示后台管理接口，无需安装 MySQL）============
spring.datasource.url=jdbc:h2:mem:shiguang_admin;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 启动时建表 + 灌入种子数据（H2 内存库每次启动重置）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 控制台（可选，便于调试：http://localhost:8081/h2-console）
spring.h2.console.enabled=true

# ============ MyBatis-Plus 配置 ============
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
